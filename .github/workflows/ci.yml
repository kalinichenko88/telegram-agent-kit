name: ci
on: [push, pull_request]

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad major shouldn't hide the others' results
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build # before test so the /deepagents dist-grep test runs
      - run: npm test

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsup
      - run: bunx vitest run
